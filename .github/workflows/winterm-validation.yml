name: winTerm validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: Validation depth
        required: true
        default: auto
        type: choice
        options:
          - auto
          - fast
          - full

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify exact change set
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
      run_fast_build: ${{ steps.classify.outputs.run_fast_build }}
      run_full_build: ${{ steps.classify.outputs.run_full_build }}
      run_package: ${{ steps.classify.outputs.run_package }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        shell: pwsh
        env:
          WINTERM_CI_MODE: ${{ inputs.validation || 'auto' }}
          WINTERM_CI_EVENT_NAME: ${{ github.event_name }}
          WINTERM_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WINTERM_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WINTERM_CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WINTERM_CI_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: .\scripts\winterm\classify-ci-changes.ps1

  quick-validation:
    name: Quick source and smoke validation
    needs: classify-changes
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run static, identity, asset, license, shell, workspace, pane, and smoke checks
        shell: powershell
        run: .\scripts\winterm\test.ps1 -Suite Smoke -Configuration Release -Platform x64

      - name: Exercise PowerShell and Command Prompt integration
        shell: powershell
        run: .\scripts\winterm\test-shell-integration.ps1 -Shell All

      - name: Validate layout fixtures and workspace performance
        shell: powershell
        run: |
          .\scripts\winterm\validate-layout.ps1 -TestFixture empty-slot.winterm-workspace.json
          .\scripts\winterm\benchmark-workspace.ps1

  fast-build:
    name: x64 Release build and relevant tests
    needs:
      - classify-changes
      - quick-validation
    if: needs.classify-changes.outputs.run_fast_build == 'true'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build x64 Release and compiled tests
        shell: pwsh
        run: .\scripts\winterm\build.ps1 -Configuration Release -Platform x64 -IncludeTests

      - name: Run relevant x64 Release compiled tests
        shell: pwsh
        run: .\scripts\winterm\test.ps1 -Suite Relevant -Configuration Release -Platform x64

  full-build:
    name: x64 ${{ matrix.configuration }} build and relevant tests
    needs:
      - classify-changes
      - quick-validation
    if: needs.classify-changes.outputs.run_full_build == 'true'
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build x64 ${{ matrix.configuration }} and compiled tests
        shell: pwsh
        run: .\scripts\winterm\build.ps1 -Configuration ${{ matrix.configuration }} -Platform x64 -IncludeTests

      - name: Run relevant x64 ${{ matrix.configuration }} compiled tests
        shell: pwsh
        run: .\scripts\winterm\test.ps1 -Suite Relevant -Configuration ${{ matrix.configuration }} -Platform x64

  package:
    name: x64 unpackaged distributions and installer lifecycle tests
    needs:
      - classify-changes
      - full-build
    if: needs.classify-changes.outputs.run_package == 'true'
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve the application version
        shell: pwsh
        run: |
          $metadata = Get-Content -LiteralPath 'src\winterm\Branding\version.json' -Raw | ConvertFrom-Json
          "WINTERM_VERSION=$($metadata.applicationVersion)" >> $env:GITHUB_ENV

      - name: Install the pinned official Inno Setup compiler
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP 'Inno-Setup-6.7.3'
          Invoke-WebRequest `
            -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' `
            -OutFile $download
          $hash = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash
          if ($hash -cne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') {
            throw "Pinned Inno Setup download hash mismatch: $hash"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw 'The pinned Inno Setup download does not have the expected trusted signature.'
          }
          $install = Start-Process -FilePath $download -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$installRoot`"") `
            -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Pinned Inno Setup installation failed with exit code $($install.ExitCode)."
          }
          "WINTERM_INNO_COMPILER=$(Join-Path $installRoot 'ISCC.exe')" >> $env:GITHUB_ENV

      - name: Build and verify unpackaged, Setup, and Portable distributions
        shell: pwsh
        run: |
          .\scripts\winterm\build-unpackaged.ps1 -Configuration Release -Platform x64 -Force
          .\scripts\winterm\build-installer.ps1 `
            -Version $env:WINTERM_VERSION `
            -Platform x64 `
            -StageDirectory 'artifacts\stage\winTerm-x64' `
            -OutputDirectory 'artifacts\release' `
            -InnoCompiler $env:WINTERM_INNO_COMPILER `
            -SkipBuild
          .\scripts\winterm\build-portable.ps1 `
            -Version $env:WINTERM_VERSION `
            -Platform x64 `
            -StageDirectory 'artifacts\stage\winTerm-x64' `
            -OutputDirectory 'artifacts\release' `
            -SkipBuild

      - name: Test current-user, all-users, and portable lifecycles
        shell: pwsh
        run: |
          .\scripts\winterm\test-installer.ps1 `
            -InstallerPath "artifacts\release\winTerm-$env:WINTERM_VERSION-setup-x64.exe" `
            -Platform x64 `
            -Version $env:WINTERM_VERSION `
            -RunSilentRoundTrip `
            -RunAllUsersRoundTrip `
            -RunDefaultPathRoundTrips
          .\scripts\winterm\test-portable.ps1 `
            -PortablePath "artifacts\release\winTerm-$env:WINTERM_VERSION-portable-x64.zip" `
            -Platform x64 `
            -Version $env:WINTERM_VERSION `
            -RunLaunch

      - name: Upload the exact unpackaged distribution allowlist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winTerm-${{ env.WINTERM_VERSION }}-x64-distributions
          path: |
            artifacts/release/winTerm-${{ env.WINTERM_VERSION }}-setup-x64.exe
            artifacts/release/winTerm-${{ env.WINTERM_VERSION }}-portable-x64.zip
          if-no-files-found: error

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - classify-changes
      - quick-validation
      - fast-build
      - full-build
      - package
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected validation job
        shell: pwsh
        env:
          CHANGE_CLASS: ${{ needs.classify-changes.outputs.change_class }}
          CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
          QUICK_RESULT: ${{ needs.quick-validation.result }}
          FAST_REQUIRED: ${{ needs.classify-changes.outputs.run_fast_build }}
          FAST_RESULT: ${{ needs.fast-build.result }}
          FULL_REQUIRED: ${{ needs.classify-changes.outputs.run_full_build }}
          FULL_RESULT: ${{ needs.full-build.result }}
          PACKAGE_REQUIRED: ${{ needs.classify-changes.outputs.run_package }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          $failures = [System.Collections.Generic.List[string]]::new()
          if ($env:CLASSIFY_RESULT -ne 'success') { $failures.Add("classification was $env:CLASSIFY_RESULT") }
          if ($env:QUICK_RESULT -ne 'success') { $failures.Add("quick validation was $env:QUICK_RESULT") }

          foreach ($job in @(
            @{ Name = 'fast build'; Required = $env:FAST_REQUIRED; Result = $env:FAST_RESULT },
            @{ Name = 'full build'; Required = $env:FULL_REQUIRED; Result = $env:FULL_RESULT },
            @{ Name = 'package'; Required = $env:PACKAGE_REQUIRED; Result = $env:PACKAGE_RESULT }
          )) {
            if ($job.Required -eq 'true' -and $job.Result -ne 'success') {
              $failures.Add("$($job.Name) was required but finished as $($job.Result)")
            }
            elseif ($job.Required -ne 'true' -and $job.Result -ne 'skipped') {
              $failures.Add("$($job.Name) was not selected but finished as $($job.Result)")
            }
          }

          "## CI gate`n`nSelected class: **$env:CHANGE_CLASS**" >> $env:GITHUB_STEP_SUMMARY
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { "- $_" >> $env:GITHUB_STEP_SUMMARY }
            throw ($failures -join '; ')
          }
          '- All required jobs succeeded; unselected jobs were intentionally skipped.' >> $env:GITHUB_STEP_SUMMARY
